<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indietro Tutta!</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
    <div style="display:flex;align-items:center;gap:12px">
        <div id="topbar-logo">⛵ Indietro Tutta</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-left:auto">
        <div id="topbar-menu">
            <button id="boatsToggleBtn" class="dropbtn">Boats</button>
            <button id="timelineToggleBtn" class="dropbtn">Timeline</button>
            <button id="coursesToggleBtn" class="dropbtn">Courses</button>
        </div>
        <div id="topbar-controls">
            <button id="liveBtn" class="active" title="Live = today, auto-refresh">● Live</button>
            <select id="presetSelect" title="Time range preset">
                <option value="today">Today</option>
                <option value="yesterday">Yesterday</option>
                <option value="thisWeek">This week</option>
                <option value="custom">Custom…</option>
            </select>
            <input type="datetime-local" id="startPicker" title="Start date & time" style="display:none">
            <span id="rangeSep" style="display:none; color:#6b7280">→</span>
            <input type="datetime-local" id="endPicker" title="End date & time" style="display:none">
            <button id="applyRangeBtn" title="Apply custom range" style="display:none; padding:5px 10px; border:1px solid #d1d5db; border-radius:6px; background:#0f172a; color:white; font-size:13px; cursor:pointer">Go</button>
            <button id="recenterBtn" title="Center map on track">⌖</button>
            <span id="dateLabel">Live — Today</span>
        </div>
    </div>
</div>
</div>

<div id="map"></div>

<div id="device-panel" style="display:none">
    <h4>Boats</h4>
    <input id="boatFilter" type="text" placeholder="Filter boats…" style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:8px;font-size:13px">
    <div id="device-list">Loading...</div>
</div>

<div id="course-panel" style="display:none">
    <h4>Courses &amp; Sessions</h4>
    <div class="course-tabs">
        <button data-ctab="templates" class="active">Templates</button>
        <button data-ctab="courses">My courses</button>
        <button data-ctab="sessions">Sessions</button>
    </div>
    <div id="course-tab-templates" class="course-tab"></div>
    <div id="course-tab-courses" class="course-tab" style="display:none"></div>
    <div id="course-tab-sessions" class="course-tab" style="display:none"></div>
</div>

<div id="builder-panel" style="display:none">
    <h4>Course builder <span style="float:right;cursor:pointer" id="builderClose">×</span></h4>
    <label class="builder-label">Name
        <input id="builder-name" maxlength="64" placeholder="e.g. Saturday stick">
    </label>
    <div id="builder-marks"></div>
    <div class="builder-row">
        <button id="builderAddMarks" title="Click map to drop marks">+ Add marks</button>
        <button id="builderSetOrigin" title="Click map to set venue origin">Set origin</button>
    </div>
    <div id="builder-origin-label" class="device-meta">Origin: not set (click Set origin)</div>
    <div class="builder-wind">
        <label>Wind from (<span id="builder-wind-val">315</span>°)
            <input type="range" id="builder-wind" min="0" max="359" value="315" style="width:100%">
        </label>
        <div class="builder-row">
            <button id="builderWindSuggest" title="Suggest wind from nearby stations">Suggest</button>
            <span id="builder-wind-src" class="device-meta"></span>
        </div>
    </div>
    <label class="builder-label">Scale
        <input id="builder-scale" type="number" min="0.1" max="5" step="0.1" value="1">
    </label>
    <div class="builder-adopt">
        <b>Adopt device waypoints</b>
        <div class="builder-row">
            <select id="adopt-boat"></select>
            <input id="adopt-date" type="date">
            <button id="adopt-load">Load</button>
        </div>
        <div class="device-meta">Pins appear on map in time order — click one to append as a mark. First append sets the origin.</div>
        <div class="builder-row">
            <button id="adopt-wind" title="Set wind from first two flags (sailed upwind leg)">Wind from first two flags</button>
        </div>
    </div>
    <div class="builder-freeze">
        <div class="builder-row">
            <input id="freeze-date" type="date">
            <select id="freeze-mode"><option value="practice">Practice</option><option value="race">Race</option></select>
        </div>
        <div id="freeze-boats" class="device-meta"></div>
        <div class="builder-row">
            <button id="builderSave">Save template</button>
            <button id="builderSaveCourse">Save course</button>
            <button id="builderFreeze" class="primary">Freeze to session</button>
        </div>
    </div>
    <div id="builder-msg" class="boat-info-err"></div>
</div>

<div id="playback">
    <div id="playback-header">
        <button id="rewindBtn" title="Rewind to start of range">⏮</button>
        <button id="playBtn">▶</button>
        <select id="playSpeed"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="20">20x</option></select>
        <span id="playLabel">00:00 / 23:59</span>
        <span id="playTime" style="margin-left:auto;font-size:12px;color:#475569"></span>
        <button id="playbackClose" style="border:none;background:#f1f5f9;border-radius:6px;padding:4px 8px;cursor:pointer">×</button>
    </div>
    <div id="timeline">
        <div id="timeline-tracks" style="position:relative;height:100%"></div>
        <div id="timeline-selection"></div>
        <div id="timeline-cursor"></div>
        <div id="timeline-hover"></div>
        <input type="range" id="playSlider" min="0" max="1000" value="0" style="position:absolute;inset:0;opacity:0.01;pointer-events:none">
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
