<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indietro Tutta - GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<div id="controls">
    <button id="liveBtn" class="active" title="Live = today, auto-refresh">● Live</button>
    <input type="date" id="datePicker" />
    <span id="dateLabel">Today</span>
</div>

<div id="device-panel">
    <h4>Devices</h4>
    <div id="device-list">Loading...</div>
</div>

<div id="builder-panel">
    <h4>Courses <button id="toggleBuilderBtn" style="float:right;border:none;background:none;cursor:pointer">▾</button></h4>
    <div id="builder-content">
        <div style="display:flex;gap:6px;margin-bottom:8px">
            <select id="templateSelect" style="flex:1"><option>Loading templates...</option></select>
            <button id="createCourseBtn">New</button>
        </div>
        <div id="course-list"></div>
        <div id="course-editor" style="display:none;margin-top:10px;border-top:1px solid #e5e7eb;padding-top:10px">
            <input id="courseName" placeholder="Course name" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px">
            <textarea id="courseDesc" placeholder="Description" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px" rows="2"></textarea>
            <div id="mark-list" style="max-height:150px;overflow-y:auto"></div>
            <div style="display:flex;gap:6px;margin-top:8px">
                <button id="saveCourseBtn" style="background:#16a34a;color:white">Save</button>
                <button id="cancelCourseBtn">Cancel</button>
                <button id="deleteCourseBtn" style="background:#dc2626;color:white;margin-left:auto">Delete</button>
            </div>
            <small style="color:#6b7280">Click map to add mark • Drag marks to move</small>
        </div>
    </div>
</div>

<div id="race-panel">
    <h4>Races <button id="toggleRaceBtn" style="float:right;border:none;background:none;cursor:pointer">▾</button></h4>
    <div id="race-content">
        <div id="race-list"></div>
        <button id="newRaceBtn" style="width:100%;margin-top:6px">+ New Race</button>
        <div id="race-editor" style="display:none;margin-top:10px;border-top:1px solid #e5e7eb;padding-top:10px">
            <input id="raceName" placeholder="Race name" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px">
            <select id="raceCourseSelect" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px"><option value="">-- Course --</option></select>
            <input id="raceStartTime" type="datetime-local" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px">
            <select id="raceStatus" style="width:100%;padding:6px;border:1px solid #d1d5db;border-radius:6px;margin-bottom:6px">
                <option value="scheduled">scheduled</option>
                <option value="live">live</option>
                <option value="finished">finished</option>
                <option value="protest">protest</option>
                <option value="final">final</option>
            </select>
            <div style="margin-bottom:6px"><strong>Participants</strong> <small>(devices)</small></div>
            <div id="raceParticipants" style="max-height:100px;overflow-y:auto;border:1px solid #e5e7eb;border-radius:6px;padding:6px"></div>
            <div style="display:flex;gap:6px;margin-top:8px">
                <button id="saveRaceBtn" style="background:#16a34a;color:white">Save</button>
                <button id="cancelRaceBtn">Cancel</button>
                <button id="deleteRaceBtn" style="background:#dc2626;color:white;margin-left:auto">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
